name: Build AmirVPN

"on":
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AmirVPN
        uses: actions/checkout@v4

      - name: Validate bundled servers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          raw = Path("client-patch/amirs-servers.b64").read_text(encoding="utf-8")
          decoded = base64.b64decode("".join(raw.split())).decode("utf-8")
          links = [
              line.strip()
              for line in decoded.splitlines()
              if line.strip().lower().startswith(("vless://", "trojan://"))
          ]
          if not links:
              raise SystemExit("No bundled VPN servers")
          if len(links) < 4:
              raise SystemExit(f"Expected at least 4 bundled servers, found {len(links)}")
          print(f"Bundled server links: {len(links)}")
          for link in links:
              print(link.split("?", 1)[0])
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          TMP="$(mktemp -d)"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$TMP/cmdline-tools.zip"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $TMP/cmdline-tools.zip" | sha256sum -c -
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q "$TMP/cmdline-tools.zip" -d "$TMP/extracted"
          cp -a "$TMP/extracted/cmdline-tools/." "$ANDROID_HOME/cmdline-tools/latest/"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.1" "build-tools;37.0.0" "ndk;28.0.13004108"
          test -d "$ANDROID_HOME/platforms/android-37.1"
          test -d "$ANDROID_HOME/build-tools/37.0.0"
          test -d "$ANDROID_HOME/ndk/28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Clone stable sing-box Android client
        shell: bash
        run: |
          git clone --depth 1 https://github.com/SagerNet/sing-box-for-android.git client
          git -C client fetch --depth 1 origin a3668ae6e4bbcb3ceff8461d0cac55d79edf504f
          git -C client checkout --detach a3668ae6e4bbcb3ceff8461d0cac55d79edf504f

      - name: Download matching libbox AAR
        shell: bash
        run: |
          mkdir -p client/app/libs
          curl -fL --retry 3 -o client/app/libs/libbox.aar https://github.com/singbox-android/libbox/releases/download/1.14.1/libbox.aar
          test -s client/app/libs/libbox.aar

      - name: Patch standalone AmirVPN
        shell: bash
        run: |
          python3 client-patch/patch.py
          test -s client/app/src/main/assets/amirs-servers.b64
          test -s client/app/src/main/java/io/nekohasekai/sfa/AmirBootstrap.kt

      - name: Build AmirVPN APK
        shell: bash
        run: |
          client/gradlew -p client :app:assembleOtherDebug --no-daemon
          APK="$(find client/app/build/outputs/apk -type f -name '*universal*debug.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            APK="$(find client/app/build/outputs/apk -type f -name '*other*debug.apk' | head -n 1)"
          fi
          test -n "$APK"
          cp "$APK" AmirVPN.apk
          ls -lh AmirVPN.apk

      - name: Run Android VPN permission and tunnel smoke test
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd --force --name amirvpn-test --package "system-images;android-35;google_apis;x86_64"
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          adb start-server
          emulator -avd amirvpn-test -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect &
          EMU_PID=$!
          trap 'kill "$EMU_PID" 2>/dev/null || true' EXIT

          timeout 120s adb wait-for-device
          for i in $(seq 1 90); do
            if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then
              break
            fi
            sleep 2
          done
          adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'

          adb install -r AmirVPN.apk
          adb logcat -c
          adb shell monkey -p io.nekohasekai.sfa 1 >/dev/null 2>&1
          adb shell pm path io.nekohasekai.sfa | grep -q '^package:'

          for i in $(seq 1 20); do
            adb shell uiautomator dump /sdcard/amirvpn-ui.xml >/dev/null 2>&1 || true
            adb pull -q /sdcard/amirvpn-ui.xml /tmp/amirvpn-ui.xml >/dev/null 2>&1 || true
            if grep -q "AmirVPN • " /tmp/amirvpn-ui.xml 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if ! grep -q "AmirVPN • " /tmp/amirvpn-ui.xml 2>/dev/null; then
            echo "Bundled AmirVPN profile was not visible after waiting."
            echo "--- AmirVPN logcat ---"
            adb logcat -d | grep -iE "AmirVPN|Exception|FATAL|libbox|profile|service" | tail -n 250 || true
            echo "--- UI XML ---"
            cat /tmp/amirvpn-ui.xml || true
            exit 1
          fi

          python3 - <<'PY'
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          root = ET.parse("/tmp/amirvpn-ui.xml").getroot()
          target = None
          for node in root.iter("node"):
              text = node.attrib.get("text", "")
              if text.startswith("AmirVPN • "):
                  target = node
                  break
          if target is None:
              raise SystemExit("Bundled AmirVPN profile not visible on Home")

          bounds = target.attrib["bounds"]
          x1,y1,x2,y2 = map(int, re.findall(r"\d+", bounds))
          subprocess.run(
              ["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],
              check=True,
          )
          PY

          sleep 2
          adb shell uiautomator dump /sdcard/amirvpn-dialog.xml >/dev/null
          adb pull -q /sdcard/amirvpn-dialog.xml /tmp/amirvpn-dialog.xml >/dev/null

          if ! grep -qiE "VPN|connection request|allow|ok" /tmp/amirvpn-dialog.xml; then
            echo "Android VPN permission dialog was not detected."
            cat /tmp/amirvpn-dialog.xml
            exit 1
          fi

          python3 - <<'PY'
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          root = ET.parse("/tmp/amirvpn-dialog.xml").getroot()
          candidates = []
          for node in root.iter("node"):
              text = node.attrib.get("text", "").strip().lower()
              desc = node.attrib.get("content-desc", "").strip().lower()
              klass = node.attrib.get("class", "")
              clickable = node.attrib.get("clickable", "false") == "true"
              enabled = node.attrib.get("enabled", "false") == "true"
              bounds = node.attrib.get("bounds")
              if not bounds:
                  continue
              if text in {"allow","ok","connect"} or "allow" in text or "allow" in desc:
                  candidates.append(bounds)
              elif clickable and enabled and "button" in klass.lower():
                  candidates.append(bounds)

          if not candidates:
              raise SystemExit("No actionable VPN permission control was found")

          def score(b):
              x1,y1,x2,y2 = map(int, re.findall(r"\d+", b))
              return (y2, x2, (x2-x1)*(y2-y1))

          bounds = sorted(candidates, key=score)[-1]
          x1,y1,x2,y2 = map(int, re.findall(r"\d+", bounds))
          subprocess.run(
              ["adb","shell","input","tap",str((x1+x2)//2),str((y1+y2)//2)],
              check=True,
          )
          PY

          sleep 5
          adb shell dumpsys vpn_management || true

          if ! adb shell ip addr show tun0 2>/dev/null | grep -q "tun0"; then
            echo "VPN permission flow completed, but tun0 was not observed."
            adb shell dumpsys activity services io.nekohasekai.sfa || true
            adb logcat -d | tail -n 250 || true
            exit 1
          fi

          if ! adb shell ip route 2>/dev/null | grep -q "tun0"; then
            echo "VPN interface exists, but no route was attached to tun0."
            adb shell ip route || true
            exit 1
          fi

          echo "VPN permission and tunnel checks passed."

      - name: Publish client-only GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" AmirVPN.apk             --title "AmirVPN $TAG"             --notes "Standalone AmirVPN client. No manager APK is published."

          echo "Cleaning old releases..."
          old_tags="$(gh release list --limit 1000 --json tagName --jq '.[].tagName' | grep -v "^$TAG$" || true)"
          while IFS= read -r old_tag; do
            [ -n "$old_tag" ] || continue
            gh release delete "$old_tag" --yes --cleanup-tag || true
          done <<< "$old_tags"

          echo "Cleaning old GitHub Actions artifacts..."
          artifact_ids="$(gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"             --jq '.artifacts[].id' || true)"
          while IFS= read -r artifact_id; do
            [ -n "$artifact_id" ] || continue
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/$artifact_id" || true
          done <<< "$artifact_ids"

          echo "Only the current client release is retained."
